<!-- Supabase → Authentication → Emails → "Confirm signup"
     Asunto sugerido: Confirma tu cuenta · Lagunillas Central -->
<div style="margin:0;padding:24px 12px;background:#f8f3e8;font-family:Arial,Helvetica,sans-serif;color:#172421">
  <div style="max-width:460px;margin:0 auto;background:#fdfbf6;border:1px solid #efe7d6;border-radius:24px;overflow:hidden">
    <div style="background:linear-gradient(180deg,#5b9fd8 0%,#9cc6ea 55%,#6b8f43 56%,#2f8a6d 100%);height:96px"></div>
    <div style="padding:28px 28px 8px">
      <p style="margin:0;font-size:13px;font-weight:bold;letter-spacing:3px;color:#c4553b">LAGUNILLAS CENTRAL</p>
      <h1 style="margin:10px 0 0;font-size:24px;line-height:1.25;color:#172421">¡Bienvenido! Confirma tu correo</h1>
      <p style="margin:12px 0 0;font-size:15px;line-height:1.55;color:#3f504c">
        Solo falta un paso para activar tu cuenta. Escribe este código en la app:
      </p>
      <div style="margin:22px 0;padding:18px;border-radius:18px;background:#eef7f2;border:1px solid #b2dcc8;text-align:center">
        <span style="font-size:34px;font-weight:bold;letter-spacing:10px;color:#1b5646;font-family:'Courier New',monospace">{{ .Token }}</span>
      </div>
      <p style="margin:16px 0 0;text-align:center">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/entrar"
           style="display:inline-block;padding:14px 26px;border-radius:14px;background:#23705a;color:#ffffff;font-weight:bold;font-size:15px;text-decoration:none">
          Confirmar mi cuenta
        </a>
      </p>
      <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#7c8a86">
        Si no creaste una cuenta en Lagunillas Central, ignora este correo.
      </p>
    </div>
    <p style="margin:20px 0 0;padding:14px;text-align:center;font-size:11px;color:#7c8a86;border-top:1px solid #efe7d6">
      Lagunillas, Mérida · Todo el pueblo en tu bolsillo
    </p>
  </div>
</div>
